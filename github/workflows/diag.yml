name: kfd-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: dump
        run: |
          git clone --recursive https://github.com/felix-pb/kfd.git /tmp/kfd
          cd /tmp/kfd
          echo "======== ALL FILES ========"
          find . -type f -not -path './.git/*' | sort
          echo "======== .c COUNT ========"
          find . -name '*.c' | wc -l
          echo "======== .c LIST ========"
          find . -name '*.c' | head -40
          echo "======== .m COUNT ========"
          find . -name '*.m' | wc -l
          echo "======== GITMODULES ========"
          cat .gitmodules 2>/dev/null || echo "none"
          echo "======== libkfd.h HEAD ========"
          head -60 kfd/libkfd.h
