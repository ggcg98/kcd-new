name: kfd-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - name: dump
        run: |
          curl -s "https://api.github.com/repos/felix-pb/kfd/git/trees/main?recursive=1" -o /tmp/t.json
          echo "==== ALL FILES ===="
          python3 -c "
import json
d = json.load(open('/tmp/t.json'))
for t in d.get('tree', []):
    if t['type'] == 'blob':
        print(t['path'])
" | sort
          echo "==== C FILE COUNT ===="
          python3 -c "
import json
d = json.load(open('/tmp/t.json'))
c = [t['path'] for t in d.get('tree', []) if t.get('path','').endswith('.c')]
print(len(c))
for x in c[:40]: print(x)
"
