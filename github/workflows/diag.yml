name: kfd-diag
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          git clone https://github.com/felix-pb/kfd.git /tmp/kfd
          cd /tmp/kfd
          echo "==== BRANCHES ===="
          git branch -a
          echo "==== TOTAL TRACKED FILES ===="
          git ls-files | wc -l
          echo "==== .c COUNT ===="
          git ls-files | grep -c '\.c$' || echo 0
          echo "==== .c LIST ===="
          git ls-files | grep '\.c$' | head -40
          echo "==== .h LIST ===="
          git ls-files | grep '\.h$' | head -40
          echo "==== ROOT FILES ===="
          git ls-files | grep -v '/' | head -20
          echo "==== libkfd.h FIRST 80 ===="
          sed -n '1,80p' kfd/libkfd.h
          echo "==== kfd.h IN HISTORY ===="
          git log --all --oneline -- '*kfd.h' | head -5
