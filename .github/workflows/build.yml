name: build-linux
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld dpkg libssl-dev libplist-dev libxml2-dev libz-dev curl || true
          sudo apt-get install -y ldid || true
          # 显式安装 Linux 下的 Objective-C 运行时库
          sudo apt-get install -y libobjc-11-dev libobjc4 || sudo apt-get install -y gobjc || true

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Fetch SDK
        run: |
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set "iPhoneOS16.5.sdk"
          mkdir -p $HOME/theos/sdks && mv "iPhoneOS16.5.sdk" $HOME/theos/sdks/

      - name: Import kfd
        run: |
          git clone --recursive --depth 1 https://github.com/felix-pb/kfd.git /tmp/kfd
          ls -l /tmp/kfd/libkfd/kfd.h || true

      - name: Generate & Fix
        run: |
          bash setup.sh
          if [ -d /tmp/kfd ]; then
            rm -rf src/kcore/kfd && cp -r /tmp/kfd src/kcore/kfd
          fi
          
          # 1. 自动改名并修复旧文件名
          mv src/kcore/koffsets.c src/kcore/koffsets.m 2>/dev/null || true
          mv src/game/ue4_offsets.c src/game/ue4_offsets.m 2>/dev/null || true
          
          sed -i 's/kcore\/koffsets.c/kcore\/koffsets.m/g' src/verify.sh src/build.sh 2>/dev/null || true
          sed -i 's/game\/ue4_offsets.c/game\/ue4_offsets.m/g' src/verify.sh src/build.sh 2>/dev/null || true
          
          # 2. 伪造系统底层声明头文件
          cat > src/kcore/libproc.h <<'EOF'
          #pragma once
          #include <sys/types.h>
          #include <limits.h>
          #ifndef PATH_MAX
          #define PATH_MAX 1024
          #endif
          #ifndef PROC_ALL_PIDS
          #define PROC_ALL_PIDS 1
          #endif
          int proc_listpids(int type, unsigned int typeinfo, void *buffer, int buffersize);
          int proc_pidpath(int pid, void *buffer, unsigned int buffersize);
          EOF

          # 3. 修复 Overlay.xm 中的类型转换与缺失声明
          sed -i 's/struct kinfo_proc \*kp = malloc(sz);/struct kinfo_proc *kp = (struct kinfo_proc *)malloc(sz);/g' src/tweak/Overlay.xm
          
          # 4. 补全完整的 substrate 头文件与 Objective-C 运行时声明
          cat > src/tweak/substrate.h <<'EOF'
          #ifndef SUBSTRATE_H
          #define SUBSTRATE_H
          #include <objc/runtime.h>
          #include <objc/message.h>
          typedef void *MSHookFunction(void *symbol, void *replace, void **result);
          void MSHookMessageEx(Class _class, SEL sel, IMP imp, IMP *result);
          #endif
          EOF

          # 5. 修补编译参数：补全包含路径，并为链接器追加 -lobjc 运行时库
          sed -i 's/I="-Ikcore/I="-Itweak -I. -Ikcore/g' src/build.sh
          sed -i 's/-shared -Wl,-undefined,dynamic_lookup/-shared -lobjc -Wl,-undefined,dynamic_lookup/g' src/build.sh

      - name: Build
        run: |
          cd src
          bash verify.sh || true
          bash build.sh

      - name: Collect Artifacts
        run: |
          mkdir -p dist
          cp src/release/*.deb dist/ || echo "NO_DEB"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: error
