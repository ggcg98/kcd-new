name: build-ios
on:
  push:
    paths-ignore: ['*.md']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          git clone --depth 1 https://github.com/Odyssey-Team/Taurine.git /tmp/t
          cd /tmp/t/Taurine/exploit/kfd
          echo "======== kfd_krw.m FULL ========"
          cat kfd_krw.m
          echo "======== common.h struct kfd ========"
          grep -n -A 40 "struct kfd {" libkfd/common.h
          echo "======== krkw.h FULL ========"
          cat libkfd/krkw.h
          echo "======== grep phys ========"
          grep -rn "phys\|PHYS\|kread_phys\|phystokv\|gPhysBase\|gVirtBase" . | head -30
