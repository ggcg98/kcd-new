name: build-ios

on:
  push:
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      kfd_ref:
        description: 'kfd commit/tag'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      SDK_VER: iPhoneOS16.5.sdk
      KFD_REF: ${{ github.event.inputs.kfd_ref || '' }}
      TC: ${{ github.workspace }}/.tc

    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: ${{ env.TC }}
          key: kcd-tc-${{ env.SDK_VER }}-v3

      - name: Install toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -e
          echo "== apt =="
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang lld llvm make git perl dpkg curl xz-utils libssl-dev binutils

          echo "== find ld64.lld =="
          ls /usr/lib/llvm-*/bin/ 2>/dev/null | grep -i 'ld' || true
          LDP=$(find /usr/lib/llvm-* /usr/bin -name 'ld64.lld' -type f 2>/dev/null | head -1)
          if [ -z "$LDP" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lld-14 llvm-14 || true
            LDP=$(find /usr/lib/llvm-14 /usr/bin -name 'ld64.lld' -type f 2>/dev/null | head -1)
          fi
          echo "LD64 = $LDP"
          [ -n "$LDP" ] || { echo "FATAL: no ld64.lld"; exit 1; }
          sudo mkdir -p /usr/local/bin
          sudo ln -sf "$LDP" /usr/local/bin/ld64.lld

          echo "== theos =="
          mkdir -p "$TC"
          echo "$LDP" > "$TC/ld64_path.txt"
          git clone --depth 1 https://github.com/theos/theos.git "$TC/theos"
          chmod +x "$TC/theos/bin/logos.pl"

          echo "== sdk =="
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set "$SDK_VER"
          mv "$SDK_VER" "$TC/sdk"
          ls "$TC/sdk/System/Library/Frameworks" | head -5

          echo "== ldid =="
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          git submodule update --init
          make -j4
          cp ldid "$TC/ldid"

          echo "== ready =="
          du -sh "$TC"

      - name: Link toolchain
        run: |
          set -e
          sudo mkdir -p /usr/local/bin
          [ -f "$TC/ld64_path.txt" ] && sudo ln -sf "$(cat "$TC/ld64_path.txt")" /usr/local/bin/ld64.lld
          sudo ln -sf "$TC/ldid" /usr/local/bin/ldid
          echo "ldid -> $(which ldid)"
          ls "$TC/sdk/System/Library/Frameworks" | head -3

      - name: Smoke test
        run: |
          set -e
          export SDK_PATH="$TC/sdk"
          echo 'int main(void){return 0;}' > /tmp/t.c
          clang -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" -c /tmp/t.c -o /tmp/t.o
          file /tmp/t.o
          clang -target arm64-apple-ios15.0 -isysroot "$SDK_PATH" /tmp/t.o \
            -fuse-ld="$(cat "$TC/ld64_path.txt")" -o /tmp/t.out
          file /tmp/t.out
          echo "SMOKE OK"

      - name: Import kfd
        continue-on-error: true
        run: |
          if [ -n "$KFD_REF" ]; then
            git clone --recursive https://github.com/felix-pb/kfd.git /tmp/kfd
            cd /tmp/kfd && git checkout "$KFD_REF" && git submodule update --init --recursive
          else
            git clone --recursive --depth 1 https://github.com/felix-pb/kfd.git /tmp/kfd
          fi
          ls -l /tmp/kfd/libkfd/kfd.h || echo "kfd missing"

      - name: Generate
        run: |
          bash setup.sh
          find src -type f | wc -l

      - name: Attach kfd
        continue-on-error: true
        run: |
          if [ -d /tmp/kfd ]; then
            rm -rf src/kcore/kfd && cp -r /tmp/kfd src/kcore/kfd
            echo "kfd attached"
          fi

      - name: Verify
        continue-on-error: true
        run: |
          cd src
          export THEOS="$TC/theos" SDK_PATH="$TC/sdk" AR=llvm-ar PATH="$TC:$PATH"
          [ -f "$TC/ld64_path.txt" ] && export LD64_PATH="$(cat "$TC/ld64_path.txt")"
          bash verify.sh || true

      - name: Build
        run: |
          cd src
          export THEOS="$TC/theos" SDK_PATH="$TC/sdk" AR=llvm-ar PATH="$TC:$PATH"
          [ -f "$TC/ld64_path.txt" ] && export LD64_PATH="$(cat "$TC/ld64_path.txt")"
          bash build.sh

      - name: Inspect
        if: always()
        run: |
          ls -lh src/release/ 2>/dev/null || true
          ls -lh src/tweak/*.dylib 2>/dev/null || true
          file src/tweak/*.dylib 2>/dev/null || true

      - name: Collect
        run: |
          mkdir -p dist
          cp src/release/*.deb dist/ || { echo NO_DEB; exit 1; }
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: error
