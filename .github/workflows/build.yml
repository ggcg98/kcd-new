name: build-ios

on:
  push:
    paths-ignore:
      - '*.md'
  workflow_dispatch:
    inputs:
      kfd_ref:
        description: 'kfd commit/tag'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    env:
      SDK_VER: iPhoneOS16.5.sdk
      KFD_REF: ${{ github.event.inputs.kfd_ref || '' }}
      TC: ${{ github.workspace }}/.tc

    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain
        id: tc
        uses: actions/cache@v4
        with:
          path: ${{ env.TC }}
          key: kcd-tc-${{ env.SDK_VER }}-v16

      - name: Install toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq clang lld llvm make g++ pkg-config git perl dpkg curl xz-utils libssl-dev binutils libplist-dev
          LDP=""
          for v in 14 15 16 13 12 11; do
            if [ -x "/usr/lib/llvm-$v/bin/ld64.lld" ]; then LDP="/usr/lib/llvm-$v/bin/ld64.lld"; break; fi
          done
          if [ -z "$LDP" ] && [ -x /usr/bin/ld64.lld ]; then LDP=/usr/bin/ld64.lld; fi
          sudo ln -sf "$LDP" /usr/local/bin/ld64.lld
          mkdir -p "$TC/theos/bin/lib/Logos" "$TC/theos/sdks"
          echo "$LDP" > "$TC/ld64_path.txt"
          printf '#!/bin/sh\ncat "$1"\n' > "$TC/theos/bin/logos.pl"
          chmod +x "$TC/theos/bin/logos.pl"
          printf 'package Logos::Util;\n1;\n' > "$TC/theos/bin/lib/Logos/Util.pm"
          ok=0
          for i in 1 2 3; do
            rm -rf /tmp/sdks
            if git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks; then
              cd /tmp/sdks
              if git sparse-checkout set "$SDK_VER"; then ok=1; break; fi
            fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then echo "FATAL sdk"; exit 1; fi
          mv "/tmp/sdks/$SDK_VER" "$TC/theos/sdks/"
          rm -rf /tmp/ldid
          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          git submodule update --init
          make -j4
          cp ldid "$TC/ldid"

      - name: Link
        run: |
          sudo mkdir -p /usr/local/bin
          if [ -f "$TC/ld64_path.txt" ]; then sudo ln -sf "$(cat "$TC/ld64_path.txt")" /usr/local/bin/ld64.lld; fi
          sudo ln -sf "$TC/ldid" /usr/local/bin/ldid
          echo "ld64 -> $(readlink -f /usr/local/bin/ld64.lld)"

      - name: Smoke
        run: |
          set -e
          S="$TC/theos/sdks/iPhoneOS16.5.sdk"
          LDP=$(cat "$TC/ld64_path.txt")
          echo 'int main(void){return 0;}' > /tmp/t.c
          clang -target arm64-apple-ios15.0 -isysroot "$S" -c /tmp/t.c -o /tmp/t.o
          clang -target arm64-apple-ios15.0 -isysroot "$S" /tmp/t.o -fuse-ld="$LDP" -Wl,-platform_version,ios,15.0,15.0 -o /tmp/t.out
          file /tmp/t.out
          echo "SMOKE OK"

      - name: Import kfd
        run: |
          set -e
          echo "==== clone ===="
          for url in \
            "https://github.com/felix-pb/kfd.git" \
            "https://gitclone.com/github.com/felix-pb/kfd.git" \
            "https://ghproxy.net/https://github.com/felix-pb/kfd.git" ; do
            echo "try: $url"
            rm -rf /tmp/kfd
            if git clone --recursive --depth 1 "$url" /tmp/kfd 2>/dev/null; then break; fi
            sleep 2
          done

          echo "==== structure ===="
          find /tmp/kfd -maxdepth 2 -type d | head -20

          echo "==== locate kfd.h ===="
          KP=$(find /tmp/kfd -name 'kfd.h' -type f 2>/dev/null | head -1)
          echo "kfd.h = $KP"
          if [ -z "$KP" ]; then echo "FATAL: no kfd.h"; exit 1; fi
          LKDIR=$(dirname "$KP")
          BASE=$(dirname "$LKDIR")
          echo "LKDIR = $LKDIR"
          echo "BASE = $BASE"
          echo "---- BASE content ----"
          ls "$BASE"

          if [ ! -d "$BASE/exploit" ]; then echo "FATAL: no exploit dir under BASE"; exit 1; fi
          echo "$BASE" > /tmp/kfd_base.txt

          echo "---- counts ----"
          ls "$BASE/libkfd"/*.c 2>/dev/null | wc -l
          ls "$BASE/libkfd"/*.m 2>/dev/null | wc -l
          ls "$BASE/exploit"/*.c 2>/dev/null | wc -l
          echo "KFD OK"

      - name: Generate
        run: |
          bash setup.sh
          find src -type f | wc -l

      - name: Fix ext
        run: |
          cd src
          if [ -f kcore/koffsets.c ]; then mv kcore/koffsets.c kcore/koffsets.m; fi
          if [ -f game/ue4_offsets.c ]; then mv game/ue4_offsets.c game/ue4_offsets.m; fi
          sed -i 's|kcore/koffsets\.c|kcore/koffsets.m|g' build.sh
          sed -i 's|game/ue4_offsets\.c|game/ue4_offsets.m|g' build.sh

      - name: Fix headers
        run: |
          cd src
          python3 -c "p='kcore/kern.m';s=open(p).read();s=s.replace('#include <libproc.h>','#include <sys/syslimits.h>\n#define PROC_ALL_PIDS 1\nextern int proc_listpids(unsigned int, unsigned int, void *, int);\nextern int proc_pidpath(int, void *, unsigned int);');open(p,'w').write(s);print('libproc ok')"
          python3 -c "p='tweak/Overlay.xm';s=open(p).read();s=s.replace('#include <sys/sysctl.h>','#include <unistd.h>\n#include <sys/sysctl.h>');s=s.replace('struct kinfo_proc *kp = malloc(sz);','struct kinfo_proc *kp = (struct kinfo_proc *)malloc(sz);');open(p,'w').write(s);print('overlay ok')"

      - name: Fix hook
        run: |
          cd src
          printf '%s\n' \
            '#include <objc/runtime.h>' \
            'static void (*kcd_orig_adfl)(id, SEL, id) = 0;' \
            'static void kcd_hook_adfl(id self, SEL _cmd, id a) {' \
            '    if (kcd_orig_adfl) kcd_orig_adfl(self, _cmd, a);' \
            '    load_cfg();' \
            '    dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{ make_window(); });' \
            '    dispatch_async(dispatch_get_global_queue(0, 0), ^{ scan_loop(NULL); });' \
            '}' \
            '__attribute__((constructor)) static void kcd_install_hook(void) {' \
            '    Class c = objc_getClass("SpringBoard");' \
            '    if (!c) return;' \
            '    Method m = class_getInstanceMethod(c, @selector(applicationDidFinishLaunching:));' \
            '    if (!m) return;' \
            '    kcd_orig_adfl = (void (*)(id, SEL, id))method_getImplementation(m);' \
            '    method_setImplementation(m, (IMP)kcd_hook_adfl);' \
            '}' > /tmp/hook.txt
          python3 -c "import re;p='tweak/Overlay.xm';s=open(p).read();h=open('/tmp/hook.txt').read();n=re.sub(r'%hook\s+SpringBoard.*?%end',h,s,flags=re.S);open(p,'w').write(n);print('hook ok')"

      - name: Patch build.sh
        run: |
          cd src
          LDP=$(cat "$TC/ld64_path.txt")
          sed -i "s|-fuse-ld=ld64.lld|-fuse-ld=$LDP -Wl,-platform_version,ios,15.0,15.0|g" build.sh
          sed -i 's|-c tweak/Overlay.mm|-x objective-c -c tweak/Overlay.mm|g' build.sh
          sed -i 's|-framework UIKit|-framework UIKit -framework CoreGraphics -framework CoreText -framework CoreImage|g' build.sh
          grep -n 'fuse-ld\|framework UIKit' build.sh

      - name: Attach kfd
        run: |
          set -e
          BASE=$(cat /tmp/kfd_base.txt)
          echo "BASE = $BASE"
          rm -rf src/kcore/kfd
          mkdir -p src/kcore/kfd
          cp -r "$BASE"/* src/kcore/kfd/
          echo "---- attached ----"
          ls src/kcore/kfd
          echo "libkfd .c = $(ls src/kcore/kfd/libkfd/*.c 2>/dev/null | wc -l)"
          echo "libkfd .m = $(ls src/kcore/kfd/libkfd/*.m 2>/dev/null | wc -l)"
          echo "exploit .c = $(ls src/kcore/kfd/exploit/*.c 2>/dev/null | wc -l)"
          if [ "$(ls src/kcore/kfd/libkfd/*.c 2>/dev/null | wc -l)" -eq 0 ]; then echo "FATAL: kfd not attached"; exit 1; fi

      - name: Build
        run: |
          cd src
          N=$(ls kcore/kfd/libkfd/*.c 2>/dev/null | wc -l)
          echo "kfd sources = $N"
          if [ "$N" -eq 0 ]; then echo "FATAL: stub build refused"; exit 1; fi
          export THEOS="$TC/theos"
          export PATH="/usr/local/bin:$TC:$PATH"
          export AR=ar
          bash build.sh

      - name: Inspect
        if: always()
        run: |
          ls -lh src/tweak/*.dylib 2>/dev/null || true
          ls -lh src/release/ 2>/dev/null || true
          file src/tweak/*.dylib 2>/dev/null || true

      - name: Collect
        run: |
          mkdir -p dist
          cp src/release/*.deb dist/ || { echo NO_DEB; exit 1; }
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: error
