name: build-ios
on:
  push:
    paths-ignore: ['*.md']
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          git clone --depth 1 https://github.com/Odyssey-Team/Taurine.git /tmp/t || true
          cd /tmp/t/Taurine/exploit/kfd || exit 1
          echo "======== info.h ========"
          cat libkfd/info.h || true
          echo "======== info/static_info.h ========"
          cat libkfd/info/static_info.h || true
          echo "======== info/dynamic_info.h ========"
          cat libkfd/info/dynamic_info.h || true
          echo "======== common.h ========"
          cat libkfd/common.h || true
          echo "======== krkw.h ========"
          cat libkfd/krkw.h || true
          echo "======== grep phys ========"
          grep -rn "phys\|PHYS" . | head -40 || true
