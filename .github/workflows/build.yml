name: build-linux
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld dpkg libssl-dev libplist-dev libxml2-dev libz-dev curl || true
          sudo apt-get install -y ldid || true

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Fetch SDK
        run: |
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set "iPhoneOS16.5.sdk"
          mkdir -p $HOME/theos/sdks && mv "iPhoneOS16.5.sdk" $HOME/theos/sdks/

      - name: Import kfd
        run: |
          git clone --recursive --depth 1 https://github.com/felix-pb/kfd.git /tmp/kfd
          ls -l /tmp/kfd/libkfd/kfd.h || true

      - name: Generate & Fix
        run: |
          bash setup.sh
          if [ -d /tmp/kfd ]; then
            rm -rf src/kcore/kfd && cp -r /tmp/kfd src/kcore/kfd
          fi
          
          # 1. 自动把包含 OC 代码的 .c 改成 .m
          mv src/kcore/koffsets.c src/kcore/koffsets.m
          mv src/game/ue4_offsets.c src/game/ue4_offsets.m
          
          # 2. 修复脚本里写死的旧文件名
          sed -i 's/kcore\/koffsets.c/kcore\/koffsets.m/g' src/verify.sh
          sed -i 's/game\/ue4_offsets.c/game\/ue4_offsets.m/g' src/verify.sh
          sed -i 's/kcore\/koffsets.c/kcore\/koffsets.m/g' src/build.sh
          sed -i 's/game\/ue4_offsets.c/game\/ue4_offsets.m/g' src/build.sh
          
          # 3. 伪造 libproc.h
          cat > src/kcore/libproc.h <<'EOF'
          #pragma once
          #include <sys/types.h>
          #include <limits.h>
          #ifndef PATH_MAX
          #define PATH_MAX 1024
          #endif
          #ifndef PROC_ALL_PIDS
          #define PROC_ALL_PIDS 1
          #endif
          int proc_listpids(int type, unsigned int typeinfo, void *buffer, int buffersize);
          int proc_pidpath(int pid, void *buffer, unsigned int buffersize);
          EOF
          
          # 4. 修复 Overlay.xm 的强转报错
          sed -i 's/struct kinfo_proc \*kp = malloc(sz);/struct kinfo_proc *kp = (struct kinfo_proc *)malloc(sz);/g' src/tweak/Overlay.xm
          
          # 5. 下载缺失的 substrate.h 头文件
          curl -sL https://raw.githubusercontent.com/theos/headers/master/substrate.h -o src/tweak/substrate.h
          
          # 6. 让编译器找得到 tweak 目录下的头文件
          sed -i 's/I="-Ikcore/I="-Itweak -I. -Ikcore/' src/build.sh
          
          # 7. 忽略 Linux 缺失的符号
          sed -i 's/-shared/-shared -Wl,-undefined,dynamic_lookup/g' src/build.sh

      - name: Build
        run: |
          cd src
          bash verify.sh || true
          bash build.sh

      - name: Collect Artifacts
        run: |
          mkdir -p dist
          cp src/release/*.deb dist/ || echo "NO_DEB"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: error
