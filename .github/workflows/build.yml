name: build-ios
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash setup.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: warn
