name: build-linux
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git make clang lld dpkg libssl-dev libplist-dev libxml2-dev libz-dev
          # 安装 ldid 和 dpkg-deb
          sudo apt-get install -y ldid || true

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH

      - name: Fetch SDK
        run: |
          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks && git sparse-checkout set "iPhoneOS16.5.sdk"
          mkdir -p $HOME/theos/sdks && mv "iPhoneOS16.5.sdk" $HOME/theos/sdks/

      - name: Import kfd
        run: |
          git clone --recursive --depth 1 https://github.com/felix-pb/kfd.git /tmp/kfd
          ls -l /tmp/kfd/libkfd/kfd.h || true

      - name: Generate & Build
        run: |
          bash setup.sh
          if [ -d /tmp/kfd ]; then
            rm -rf src/kcore/kfd && cp -r /tmp/kfd src/kcore/kfd
          fi
          cd src && bash verify.sh || true
          cd src && bash build.sh

      - name: Collect Artifacts
        run: |
          mkdir -p dist
          cp src/release/*.deb dist/ || echo "NO_DEB"
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: error
