name: build-ios
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.tc
          key: kcd-tc-v24
      - run: bash ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: warn
