name: build-ios

on:
  push:
    paths-ignore:
      - '*.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      kfd_ref:
        description: 'kfd commit/tag'
        required: false
        default: ''

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      SDK_VER: iPhoneOS16.5.sdk
      KFD_REF: ${{ github.event.inputs.kfd_ref || '' }}
      TC: ${{ github.workspace }}/.tc

    steps:
      - uses: actions/checkout@v4

      - name: Restore toolchain cache
        id: tc
        uses: actions/cache@v4
        with:
          path: ${{ env.TC }}
          key: kcd-tc-${{ env.SDK_VER }}-v1

      - name: Install toolchain
        if: steps.tc.outputs.cache-hit != 'true'
        run: |
          set -e
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            clang lld llvm make git perl dpkg curl xz-utils libssl-dev binutils
          sudo ln -sf /usr/lib/llvm-*/bin/ld64.lld /usr/local/bin/ld64.lld

          mkdir -p "$TC"
          git clone --depth 1 https://github.com/theos/theos.git "$TC/theos"
          chmod +x "$TC/theos/bin/logos.pl"

          git clone --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set "$SDK_VER"
          mv "$SDK_VER" "$TC/sdk"

          git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
          cd /tmp/ldid
          git submodule update --init
          make -j4
          cp ldid "$TC/ldid"

          echo "cache ready"
          du -sh "$TC"

      - name: Link toolchain
        run: |
          sudo ln -sf "$TC/ldid" /usr/local/bin/ldid || true
          ls -l "$TC"
          ls "$TC/sdk/System/Library/Frameworks" | head -3

      - name: Import kfd
        continue-on-error: true
        run: |
          if [ -n "$KFD_REF" ]; then
            git clone --recursive https://github.com/felix-pb/kfd.git /tmp/kfd
            cd /tmp/kfd && git checkout "$KFD_REF" && git submodule update --init --recursive
          else
            git clone --recursive --depth 1 https://github.com/felix-pb/kfd.git /tmp/kfd
          fi
          ls -l /tmp/kfd/libkfd/kfd.h || true

      - name: Generate sources
        run: |
          bash setup.sh
          find src -type f | wc -l

      - name: Attach kfd
        continue-on-error: true
        run: |
          if [ -d /tmp/kfd ]; then
            rm -rf src/kcore/kfd
            cp -r /tmp/kfd src/kcore/kfd
          fi

      - name: Verify
        continue-on-error: true
        run: |
          cd src
          export THEOS="$TC/theos"
          export SDK_PATH="$TC/sdk"
          export AR=llvm-ar
          export PATH="$TC:$PATH"
          bash verify.sh || true

      - name: Build
        run: |
          cd src
          export THEOS="$TC/theos"
          export SDK_PATH="$TC/sdk"
          export AR=llvm-ar
          export PATH="$TC:$PATH"
          bash build.sh

      - name: Collect
        run: |
          mkdir -p dist
          cp src/release/*.deb dist/ 2>/dev/null || echo NO_DEB
          ls -lh dist/

      - uses: actions/upload-artifact@v4
        with:
          name: KCD-deb
          path: dist/*.deb
          if-no-files-found: error
