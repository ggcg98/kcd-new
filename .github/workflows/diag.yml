name: kfd-check
on:
  workflow_dispatch:
jobs:
  c:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          for repo in Odyssey-Team/Taurine SerotoninApp/Serotonin GenericCoding/poisOnKFD hrtowii/kfd NoorahSmith/kernel-file-descriptor; do
            echo "======== $repo ========"
            rm -rf /tmp/t
            if ! git clone --depth 1 "https://github.com/$repo.git" /tmp/t 2>/dev/null; then
              echo "  CLONE FAIL"
              continue
            fi
            echo "  -- dirs named kfd --"
            find /tmp/t -type d -name kfd | head -5
            echo "  -- .c files containing kopen --"
            grep -rl "kopen" /tmp/t --include='*.c' 2>/dev/null | head -5
            echo "  -- .c count per kfd dir --"
            for d in $(find /tmp/t -type d -name kfd); do
              echo "    $d -> $(find "$d" -maxdepth 1 -name '*.c' | wc -l)"
            done
            echo "  -- total .c in repo --"
            find /tmp/t -name '*.c' | wc -l
          done
