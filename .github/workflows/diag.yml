name: kfd-check
on:
  workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-22.04
    steps:
      - run: |
          git clone --depth 1 https://github.com/Odyssey-Team/Taurine.git /tmp/t
          cd /tmp/t/Taurine/exploit/kfd
          echo "==== ls ===="
          ls -la
          echo "==== line counts ===="
          wc -l *.h
          echo "==== kfd_krw.h head 40 ===="
          head -40 kfd_krw.h
          echo "==== does kfd_krw.h contain function bodies ===="
          grep -n "^[a-z].*kopen\|^{" kfd_krw.h | head -10
          echo "==== libkfd.h includes ===="
          grep -n '#include' libkfd.h
          echo "==== libkfd.h tail ===="
          tail -30 libkfd.h
